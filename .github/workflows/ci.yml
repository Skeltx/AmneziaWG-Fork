name: CI/CD

on:
  push:
    branches: [main, master, develop, "feat/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache sing-box-lx core
        uses: actions/cache@v4
        with:
          path: ui/libs/libbox.aar
          key: libbox-1.14.4-lx.37

      - name: Fetch sing-box-lx core
        run: |
          chmod +x ./scripts/fetch-libbox.sh
          ./scripts/fetch-libbox.sh

      - name: Build Debug and Release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Sign release APK with the debug key
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out ui/build/outputs/apk/release/ui-release.apk \
            ui/build/outputs/apk/release/ui-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ui/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ui/build/outputs/apk/release/ui-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AmneziaWG Fork v${{ github.run_number }}
          body: |
            Automated build from `master`.

            - `ui-debug.apk` — debug build
            - `ui-release.apk` — R8 release build, signed with the Android debug key for sideloading
          files: |
            ui/build/outputs/apk/debug/*.apk
            ui/build/outputs/apk/release/ui-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
