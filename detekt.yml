build:
  maxIssues: 100
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warnsAsErrors: false

formatting:
  android: true
  autoCorrect: false
  indentSize: 4
  continuationIndentSize: 4
  maxLineLength: 120
  noConsecutiveBlankLines: 1
  noWildcardImports: true
  noUnusedImports: true

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: -1..10
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreFunctionDeclaration: true
    ignoreEnumDeclaration: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  NestedBlockDepth:
    active: true
    maxDepth: 4
  ReturnCount:
    active: true
    max: 6
    excludedFunctions: "equals,hashCode,toString"
  TooManyFunctions:
    active: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
  WildcardImport:
    active: true
    excludes: ['java.util.*', 'kotlinx.coroutines.*']

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 4
  ComplexInterface:
    active: true
    threshold: 10
  ComplexMethod:
    active: true
    threshold: 10
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  LabeledExpression:
    active: true
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    threshold: 6
    ignoreDefaultValues: true
    functionThreshold: 6
    constructorThreshold: 7
  MethodOverloading:
    active: true
    threshold: 6
  NestedBlockDepth:
    active: true
    threshold: 4
  StringLiteralDuplication:
    active: true
    threshold: 3
    ignoreAnnotation: true
    excludeStringsWithLessThan5Characters: true
    ignoreStringsRegex: '$^'
  TooManyFunctions:
    active: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11

exceptions:
  active: true
  InstanceOfCheckForException:
    active: true
  NotImplementedDeclaration:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowedException:
    active: true
    ignoredTypes:
      - Exception
      - Throwable
      - RuntimeException
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
    allowedExceptions:
      - IllegalArgumentException
      - IllegalStateException
      - IOException
      - AssertionError
  ThrowingNewInstanceOfSameException:
    active: true

comments:
  active: true
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  EndOfSentenceFormat:
    active: true
    endOfSentenceFormat: ([.!?] )
  KDocStyle:
    active: true
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  UndocumentedPublicClass:
    active: false

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '^[A-Z][a-zA-Z0-9]*$'
  FunctionNaming:
    active: true
    functionPattern: '^[a-z][a-zA-Z0-9]*$'
    excludeClassPattern: '$^'
  VariableNaming:
    active: true
    variablePattern: '^[a-z][a-zA-Z0-9]*$'
    privateVariablePattern: '^(_)?[a-z][a-zA-Z0-9]*$'
  ParameterNaming:
    active: true
    parameterPattern: '^[a-z][a-zA-Z0-9]*$'
  BooleanPropertyNaming:
    active: true
    forbiddenPrefixes: 'is,has,can,should,will,from'

potential-bugs:
  active: true
  BinaryOperatorInLambdaWithUnitReturnType:
    active: true
  DoubleNegativeLambda:
    active: true
  DuplicateCaseInWhenExpression:
    active: true
  DuplicateMapKey:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  FloatPrecisionComparison:
    active: true
  FunctionReturnsAlwaysConstant:
    active: true
  HashCodeAndEquals:
    active: true
  LateinitUsage:
    active: true
  MisplacedBreakOrContinueInLambda:
    active: true
  NullCheckOnNullableTypeParameter:
    active: true
  OperatorWrapping:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  UseCheckNotNull:
    active: true

performance:
  active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UselessPostfixExpression:
    active: true

# Disable some rules that are too strict for this project
Formatting:
  WildcardImport:
    active: false

style:
  ReturnCount:
    active: false
  TooManyFunctions:
    active: false

complexity:
  LongMethod:
    active: false
  LargeClass:
    active: false